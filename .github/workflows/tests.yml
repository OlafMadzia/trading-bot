name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "logs/**", "docs/**"]  # skip the bot's own daily log commits
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -v
